version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Check for Docker image updates
  - package-ecosystem: "docker"
    directory: "/caddy-bunny-ddns"
    schedule:
      interval: "daily"
  - package-ecosystem: "docker"
    directory: "/caddy-desec-ddns"
    schedule:
      interval: "daily"
